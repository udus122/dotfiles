name: hooks

# ガードは、誤検知すると正当な操作を止め、見落とすと安全弁として機能しない。
# どちらの向きの退行も気付きにくいので、代表的なコマンドの表で機械的に点検する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-git-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: push ガードの判定表
        run: ./tools/test-check-git-push.sh

  check-gh-pr-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gh pr close ガードの判定表
        run: ./tools/test-check-gh-pr-close.sh

  check-pr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PR レビューゲートの判定表
        run: ./tools/test-check-pr-review.sh
